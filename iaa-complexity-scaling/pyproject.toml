[project]
name = "iaa-demo-notebooks"
version = "0.1.0"
description = "Demo Jupyter notebooks for archetypal analysis image and complexity-scaling experiments."
authors = [
    {name = "Jonathan Yik Chang Ting"},
]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9.1",
    "seaborn>=0.13.2",
    "natsort>=8.4.0",
    "pandas>=2.2.2",
    "scikit-learn>=1.5.1",
    "numpy>=1.26.4",
    "pillow>=10.4.0",
    "spams>=2.0",
    "scipy>=1.10.0",
    "iteraa>=0.2.0",
]

[tool.setuptools.packages.find]
include = ["runSS", "runTC_*", "plot*", "runWS", "runTC_IAA", "runTC_2D", "runTC_RAA"]

[dependency-groups]
dev = [
    "jupyter>=1.0.0",
    "ipykernel>=6.29.4",
    "nbconvert>=7.16.4",
]
