[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iaa-complexity-scaling"
version = "0.1.0"
description = "IAA complexity scaling benchmarks"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "iteraa",
]

[project.urls]
Homepage = "https://github.com/your-org/iaa-complexity-scaling"

[tool.setuptools.packages.find]
where = ["."]